<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Daily Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">📊 Daily Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link">Welcome, {{ username }}!</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-3">
            <div class="col-12">
                <h4>Last Updated: <span id="lastUpdated"></span></h4>
                <button class="btn btn-sm btn-outline-primary" onclick="refreshAll()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh All
                </button>
            </div>
        </div>

        <!-- Stock Market Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-graph-up"></i> Indian Stock Markets</h5>
                    </div>
                    <div class="card-body">
                        <div id="stocksLoading" class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="stocksContent" class="row" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Weather Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="bi bi-cloud-sun"></i> Weather Forecast</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="locationInput" class="form-label">Enter Location:</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="locationInput" placeholder="e.g., Mumbai, Delhi, Bangalore" value="Mumbai">
                                <button class="btn btn-primary" onclick="loadWeather()">Get Weather</button>
                            </div>
                        </div>
                        <div id="weatherLoading" class="text-center" style="display: none;">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="weatherContent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- News Section -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card shadow h-100">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="bi bi-newspaper"></i> World News</h5>
                    </div>
                    <div class="card-body">
                        <div id="worldNewsLoading" class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="worldNewsContent" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow h-100">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="bi bi-laptop"></i> Tech News</h5>
                    </div>
                    <div class="card-body">
                        <div id="techNewsLoading" class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="techNewsContent" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
